limit_req_zone $binary_remote_addr zone=cover_requests:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  # Traefik is reached only through the Docker private network.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://supabase.75.119.140.201.nip.io wss://supabase.75.119.140.201.nip.io; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;

  location ^~ /covers/v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cover_service bibliesi-cover-service;
    proxy_pass http://$cover_service:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 35s;
    limit_req zone=cover_requests burst=60 nodelay;
    limit_req_status 429;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://supabase.75.119.140.201.nip.io wss://supabase.75.119.140.201.nip.io; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://supabase.75.119.140.201.nip.io wss://supabase.75.119.140.201.nip.io; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://supabase.75.119.140.201.nip.io wss://supabase.75.119.140.201.nip.io; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://supabase.75.119.140.201.nip.io wss://supabase.75.119.140.201.nip.io; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
